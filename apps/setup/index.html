<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover removed as a test (round 6): on-device
         diagnostics showed the standalone webview's own rendering
         surface capped at innerHeight/visualViewport.height (793) well
         short of the true screen (852) — a gap that survived deleting
         and reinstalling the home-screen icon, so it isn't cached
         webclip config either. cover is what hands iOS's status-bar/
         home-indicator safe areas over to the page in the first place;
         without it, env(safe-area-inset-*) should read 0 and iOS
         reserves that space natively instead. If that closes the gap,
         the black-translucent status-bar look (below) needs revisiting
         separately, since it depends on cover to have any effect. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Manifest's display:standalone covers Android/Chrome; iOS Safari
         needs these Apple-specific tags too for a reliably chrome-free
         launch from the home-screen icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: only iOS mode that lets page content show
         through the status bar. Its icons are always white (no dark-icon
         option exists), so the header gradient below is dark at the very
         top for contrast. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SetUp" />
    <title>SetUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
