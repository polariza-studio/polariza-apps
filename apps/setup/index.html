<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Manifest's display:standalone covers Android/Chrome; iOS Safari
         needs these Apple-specific tags too for a reliably chrome-free
         launch from the home-screen icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: only iOS mode that lets page content show
         through the status bar. Its icons are always white (no dark-icon
         option exists), so the header gradient below is dark at the very
         top for contrast. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SetUp" />
    <title>SetUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
