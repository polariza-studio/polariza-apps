<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Manifest's display:standalone covers Android/Chrome; iOS Safari
         needs these Apple-specific tags too for a reliably chrome-free
         launch from the home-screen icon. No viewport-fit=cover / status
         bar customization on purpose: the installed app must render
         identically to the mobile browser tab, not extend content under
         the status bar/home indicator with its own safe-area handling —
         that whole layer of PWA-specific treatment (see git history
         around "Revert mobile/PWA-specific UI changes") caused more
         regressions (clipped sticky bars, broken scroll) than it was
         worth. iOS just reserves the status bar natively here, same as
         any other webpage. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SetUp" />
    <title>SetUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
